name: CI — Continuous Integration

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-lint-and-analysis:
    name: 🔬 Android Lint & Detekt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21' # Updated to Java 21 to match the backend
          distribution: 'temurin'
          cache: gradle
      - name: Run Ktlint
        run: ./gradlew ktlintCheck
      - name: Run Detekt
        run: ./gradlew detekt
      - name: Upload Detekt Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: detekt-report
          path: build/reports/detekt/

  android-unit-tests:
    name: 🧪 Android Unit Tests
    runs-on: ubuntu-latest
    needs: android-lint-and-analysis
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle
      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest
      - name: Generate Coverage Report
        run: ./gradlew jacocoTestReport
      - name: Check Coverage Threshold (80%)
        run: ./gradlew jacocoCoverageVerification
      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-results
          path: app/build/reports/tests/

  backend-tests:
    name: ☕ Backend Spring Boot Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Run Maven Tests & Checkstyle
        working-directory: ./backend
        run: ./mvnw clean verify -B
      - name: Upload Backend Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: backend/target/surefire-reports/

  security-scan:
    name: 🔐 Security Scan (Full Stack)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan for secrets (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: OWASP Dependency Check (Android)
        run: ./gradlew dependencyCheckAnalyze
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        continue-on-error: true
      - name: OWASP Dependency Check (Backend)
        working-directory: ./backend
        run: ./mvnw org.owasp:dependency-check-maven:check
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        continue-on-error: true

  build-debug-apk:
    name: 🔨 Build Debug APK
    runs-on: ubuntu-latest
    needs: [ android-unit-tests, security-scan ]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle
      - name: Build Debug APK
        run: ./gradlew assembleDebug
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL_DEV }}
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

  build-backend-jar:
    name: 📦 Build Spring Boot JAR
    runs-on: ubuntu-latest
    needs: [ backend-tests, security-scan ]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Build Executable JAR
        working-directory: ./backend
        run: ./mvnw package -DskipTests -B
      - name: Upload Backend JAR
        uses: actions/upload-artifact@v4
        with:
          name: spring-boot-jar
          path: backend/target/*.jar
